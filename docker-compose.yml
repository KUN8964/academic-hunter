# Academic Hunter — PostgreSQL with pgvector
# Start: docker compose up -d
# Stop:  docker compose down   (keeps data volume)
# Nuke:  docker compose down -v (destroys data!)

services:
  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    environment:
      POSTGRES_USER: hunter
      POSTGRES_PASSWORD: hunter
      POSTGRES_DB: academic_hunter
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgvector_data:
    name: pgvector_data
